[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotest-lab"
version = "0.1.0"
description = "Virtual automotive ECU testing and diagnostics platform"
requires-python = ">=3.10"
dependencies = ["python-can>=4,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]